name: Assemble release draft

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to assemble (for example v1.3.0)
        required: true
        type: string
      artifact_run_id:
        description: Successful release workflow run ID containing the package artifacts
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-assemble-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  assemble:
    name: Assemble verified draft release
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false

      - name: Install artifact validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            dpkg-dev \
            jq \
            libarchive-tools \
            libpipewire-0.3-0 \
            ripgrep \
            rpm \
            unzip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.0

      - name: Download tested artifacts from release run
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id }}
          pattern: lensguard-*
          path: release-artifacts
          merge-multiple: true

      - name: Verify complete release bundle
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --locked
          daemon=$(find release-artifacts -maxdepth 1 -type f \
            -name "camera-monitor-$(./scripts/project-version.sh)-*" -print -quit)
          [[ -n $daemon ]] || {
            printf '%s\n' 'release bundle is missing the camera monitor binary' >&2
            exit 1
          }
          chmod 0755 "$daemon"
          (
            cd release-artifacts
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' | \
              sort | xargs -r sha256sum > SHA256SUMS
          )
          ./scripts/check-release.sh release-artifacts
          ./scripts/check-package-artifacts.sh release-artifacts

      - name: Upload complete verified bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lensguard-release-${{ inputs.release_tag }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Create or update draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ $draft != true ]]; then
              printf 'Refusing to modify existing published release %s.\n' "$RELEASE_TAG" >&2
              exit 1
            fi
            gh release delete "$RELEASE_TAG" --yes
          fi
          banner_url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$(git rev-parse HEAD)/docs/images/lensguard-banner.png"
          gh release create "$RELEASE_TAG" release-artifacts/* \
            --draft \
            --verify-tag \
            --generate-notes \
            --notes "![LensGuard banner]($banner_url)" \
            --title "LensGuard ${RELEASE_TAG#v}"
