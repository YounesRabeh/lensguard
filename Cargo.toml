[workspace]
members = [
    "crates/camera-app-resolver",
    "crates/camera-core",
    "crates/camera-dbus",
    "daemon",
    "observer",
]
resolver = "3"

[workspace.package]
version = "1.6.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/younesrabeh/lensguard"

[workspace.dependencies]
camera-app-resolver = { path = "crates/camera-app-resolver" }
camera-core = { path = "crates/camera-core" }
camera-dbus = { path = "crates/camera-dbus" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
