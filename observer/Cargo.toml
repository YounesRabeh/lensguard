[package]
name = "lensguard-v4l2-observer"
description = "Privileged metadata-only V4L2 observer for LensGuard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[lints]
workspace = true

[dependencies]
aya = { version = "0.13.1", features = ["async_tokio"] }
bytes = "1.10.1"
camera-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
